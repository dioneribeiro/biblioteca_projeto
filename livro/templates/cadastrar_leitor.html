{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="search-container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="d-flex align-items-center">
                            <a href="{% url 'listar_leitores' %}" class="btn btn-outline-secondary me-3">
                                <i class="bi bi-arrow-left me-2"></i>Voltar
                            </a>
                            <div>
                                <h2 class="mb-2 text-primary">
                                    <i class="bi bi-person-plus me-2"></i>
                                    {% if leitor %}Editar Leitor{% else %}Novo Leitor{% endif %}
                                </h2>
                                <p class="text-muted mb-0">
                                    {% if leitor %}Atualize as informações do leitor{% else %}Cadastre um novo leitor na biblioteca{% endif %}
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <div class="d-flex justify-content-end">
                            <div class="me-3">
                                <h4 class="text-primary mb-0">
                                    <i class="bi bi-people me-2"></i>
                                </h4>
                                <small class="text-muted">Leitor</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <!-- Nome -->
                            <div class="col-md-12 mb-3">
                                <label for="nome" class="form-label fw-bold">
                                    <i class="bi bi-person me-2 text-primary"></i>Nome Completo
                                </label>
                                <input type="text" name="nome" class="form-control form-control-lg" 
                                       value="{{ leitor.nome|default:'' }}" required 
                                       placeholder="Digite o nome completo do leitor">
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">
                                    <i class="bi bi-envelope me-2 text-primary"></i>Email
                                </label>
                                <input type="email" name="email" class="form-control form-control-lg" 
                                       value="{{ leitor.email|default:'' }}" required 
                                       placeholder="exemplo@email.com">
                            </div>

                            <!-- Telefone -->
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label fw-bold">
                                    <i class="bi bi-telephone me-2 text-primary"></i>Telefone
                                </label>
                                <input type="text" name="telefone" class="form-control form-control-lg" 
                                       value="{{ leitor.telefone|default:'' }}" 
                                       placeholder="(11) 99999-9999">
                            </div>

                            <!-- Endereço -->
                            <div class="col-md-12 mb-3">
                                <label for="endereco" class="form-label fw-bold">
                                    <i class="bi bi-geo-alt me-2 text-primary"></i>Endereço
                                </label>
                                <input type="text" name="endereco" class="form-control form-control-lg" 
                                       value="{{ leitor.endereco|default:'' }}" 
                                       placeholder="Rua, número, bairro, cidade">
                            </div>

                            <!-- RG -->
                            <div class="col-md-6 mb-3">
                                <label for="rg" class="form-label fw-bold">
                                    <i class="bi bi-card-text me-2 text-primary"></i>RG
                                </label>
                                <input type="text" name="rg" class="form-control form-control-lg" 
                                       value="{{ leitor.rg|default:'' }}" 
                                       placeholder="00.000.000-0">
                            </div>

                            <!-- CPF -->
                            <div class="col-md-6 mb-4">
                                <label for="cpf" class="form-label fw-bold">
                                    <i class="bi bi-card-text me-2 text-primary"></i>CPF
                                </label>
                                <input type="text" name="cpf" class="form-control form-control-lg" 
                                       value="{{ leitor.cpf|default:'' }}" 
                                       placeholder="000.000.000-00">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="bi bi-check-circle me-2"></i>
                                {% if leitor %}Salvar Alterações{% else %}Cadastrar Leitor{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control, .form-select {
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    
    .form-control:focus, .form-select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .form-control-lg, .form-select-lg {
        padding: 0.75rem 1rem;
    }
    
    .btn-lg {
        padding: 0.75rem 2rem;
        border-radius: 12px;
        font-weight: 600;
    }
</style>

<script>
    // Máscara para telefone
    document.addEventListener('DOMContentLoaded', function() {
        const telefoneInput = document.querySelector('input[name="telefone"]');
        const cpfInput = document.querySelector('input[name="cpf"]');
        const rgInput = document.querySelector('input[name="rg"]');
        
        // Máscara para telefone
        if (telefoneInput) {
            telefoneInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length <= 11) {
                    value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
                    e.target.value = value;
                }
            });
        }
        
        // Máscara para CPF
        if (cpfInput) {
            cpfInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length <= 11) {
                    value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
                    e.target.value = value;
                }
            });
        }
        
        // Máscara para RG
        if (rgInput) {
            rgInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length <= 9) {
                    value = value.replace(/(\d{2})(\d{3})(\d{3})(\d{1})/, '$1.$2.$3-$4');
                    e.target.value = value;
                }
            });
        }
    });
</script>
{% endblock %}
