{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="search-container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="d-flex align-items-center">
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary me-3">
                                <i class="bi bi-arrow-left me-2"></i>Voltar
                            </a>
                            <div>
                                <h2 class="mb-2 text-primary">
                                    <i class="bi bi-plus-circle me-2"></i>
                                    {% if livro %}Editar Livro{% else %}Cadastrar Novo Livro{% endif %}
                                </h2>
                                <p class="text-muted mb-0">
                                    {% if livro %}Atualize as informações do livro{% else %}Adicione um novo livro à biblioteca{% endif %}
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <div class="d-flex justify-content-end">
                            <div class="me-3">
                                <h4 class="text-primary mb-0">
                                    <i class="bi bi-book me-2"></i>
                                </h4>
                                <small class="text-muted">Livro</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <!-- Nome do Livro -->
                            <div class="col-md-12 mb-3">
                                <label for="nome" class="form-label fw-bold">
                                    <i class="bi bi-book me-2 text-primary"></i>Nome do Livro
                                </label>
                                <input type="text" name="nome" class="form-control form-control-lg" 
                                       value="{{ livro.nome }}" required 
                                       placeholder="Digite o nome do livro">
                            </div>

                            <!-- Autor -->
                            <div class="col-md-12 mb-3">
                                <label for="autor" class="form-label fw-bold">
                                    <i class="bi bi-person me-2 text-primary"></i>Autor
                                </label>
                                <input type="text" name="autor" class="form-control form-control-lg" 
                                       value="{{ livro.autor }}" required 
                                       placeholder="Digite o nome do autor">
                            </div>

                            <!-- Categoria -->
                            <div class="col-md-6 mb-3">
                                <label for="categoria" class="form-label fw-bold">
                                    <i class="bi bi-tag me-2 text-primary"></i>Categoria
                                </label>
                                <select name="categoria" class="form-select form-select-lg" required>
                                    <option value="">Selecione uma categoria</option>
                                    {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}" 
                                            {% if categoria.id == livro.categoria.id %}selected{% endif %}>
                                        {{ categoria.nome }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Status de Empréstimo -->
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">
                                    <i class="bi bi-calendar-check me-2 text-primary"></i>Status
                                </label>
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" name="emprestado" class="form-check-input" 
                                           id="emprestado" {% if livro.emprestado %}checked{% endif %}>
                                    <label class="form-check-label" for="emprestado">
                                        Este livro está emprestado
                                    </label>
                                </div>
                            </div>

                            <!-- Leitor (se emprestado) -->
                            <div class="col-md-12 mb-3" id="leitor-section" style="display: none;">
                                <label for="leitor" class="form-label fw-bold">
                                    <i class="bi bi-person-badge me-2 text-primary"></i>Leitor
                                </label>
                                <select name="leitor" class="form-select form-select-lg">
                                    <option value="">Selecione um leitor</option>
                                    {% for leitor in leitores %}
                                    <option value="{{ leitor.id }}" 
                                            {% if leitor in livro.leitor.all %}selected{% endif %}>
                                        {{ leitor.nome }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Sinopse -->
                            <div class="col-md-12 mb-4">
                                <label for="sinopse" class="form-label fw-bold">
                                    <i class="bi bi-file-text me-2 text-primary"></i>Sinopse
                                </label>
                                <textarea name="sinopse" class="form-control" rows="5" 
                                          placeholder="Digite uma breve descrição do livro">{{ livro.sinopse }}</textarea>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="bi bi-check-circle me-2"></i>
                                {% if livro %}Salvar Alterações{% else %}Cadastrar Livro{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control, .form-select {
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    
    .form-control:focus, .form-select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .form-control-lg, .form-select-lg {
        padding: 0.75rem 1rem;
    }
    
    .form-check-input {
        width: 3rem;
        height: 1.5rem;
        border-radius: 1rem;
    }
    
    .form-check-input:checked {
        background-color: #667eea;
        border-color: #667eea;
    }
    
    .btn-lg {
        padding: 0.75rem 2rem;
        border-radius: 12px;
        font-weight: 600;
    }
</style>

<script>
    // Mostrar/ocultar seção do leitor baseado no status de empréstimo
    document.addEventListener('DOMContentLoaded', function() {
        const emprestadoCheckbox = document.getElementById('emprestado');
        const leitorSection = document.getElementById('leitor-section');
        
        function toggleLeitorSection() {
            if (emprestadoCheckbox.checked) {
                leitorSection.style.display = 'block';
            } else {
                leitorSection.style.display = 'none';
            }
        }
        
        emprestadoCheckbox.addEventListener('change', toggleLeitorSection);
        toggleLeitorSection(); // Executar na carga inicial
    });
</script>
{% endblock %}
