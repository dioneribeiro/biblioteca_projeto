<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }
      
      .navbar {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .navbar-brand {
        font-weight: 600;
        color: #667eea !important;
        font-size: 1.5rem;
      }
      
      .nav-link {
        color: #555 !important;
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 8px;
        padding: 8px 16px !important;
        margin: 0 4px;
      }
      
      .nav-link:hover {
        color: #667eea !important;
        background-color: rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }
      
      .btn-outline-primary {
        border-color: #667eea;
        color: #667eea;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      
      .btn-outline-primary:hover {
        background-color: #667eea;
        border-color: #667eea;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }
      
      .btn-outline-secondary {
        border-color: #6c757d;
        color: #6c757d;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      
      .btn-outline-secondary:hover {
        background-color: #6c757d;
        border-color: #6c757d;
        transform: translateY(-2px);
      }
      
      .form-control {
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
      }
      
      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      }
      
      .main-content {
        margin-top: 100px;
        padding: 20px;
      }
      
      .card {
        border-radius: 16px;
        border: none;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }
      
      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
      }
      
      .search-container {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
    </style>

    {% block 'head' %} {% endblock %}
    
    <title>{% block 'titulo' %}Biblioteca{% endblock %}</title>
  </head>
  
  <body>
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid">
        <a href="{% url 'home' %}" class="navbar-brand">
          <i class="bi bi-book-half me-2"></i>
          Biblioteca
        </a>

        {% if user_authenticated %}
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a href="{% url 'home' %}" class="nav-link">
                  <i class="bi bi-house-door me-1"></i>Livros
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'cadastrar_livro' %}" class="nav-link">
                  <i class="bi bi-plus-circle me-1"></i>Cadastrar Livro
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'listar_categorias' %}" class="nav-link">
                  <i class="bi bi-tags me-1"></i>Categorias
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'listar_leitores' %}" class="nav-link">
                  <i class="bi bi-people me-1"></i>Leitores
                </a>
              </li>
            </ul>
            
            <form method="GET" action="{% url 'home' %}" class="d-flex me-3" role="search">
              <input class="form-control me-2" type="search" name="query" placeholder="Buscar por nome, autor ou categoria" aria-label="Search">
              <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </form>
            
            <div class="d-flex align-items-center">
              <span class="navbar-text me-3">
                <i class="bi bi-person-circle me-1"></i>{{ request.session.username }}
              </span>
              <a href="{% url 'sair' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Sair
              </a>
            </div>
          </div>
        {% endif %}
      </div>
    </nav>

    <div class="main-content">
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
